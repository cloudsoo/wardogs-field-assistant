name: Wardogs QA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest.json OK')"
      - name: Syntax check app.js
        run: node --check app.js
      - name: Verify V6 shell wiring
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const js=fs.readFileSync('app.js','utf8');
          const sw=fs.readFileSync('service-worker.js','utf8');
          for(const s of ['page1','page2','bearingInput','setGun','setTarget','lockGun','lockTarget','clearGun','clearTarget','data-layer','app.js']) if(!html.includes(s)) throw new Error('Missing HTML feature: '+s);
          for(const s of ['pointerdown','pointermove','pointerup','startDist','currentTileZoom','towerQuick','selectTower','cdn.jsdelivr.net','raw.githubusercontent.com','poiIcon']) if(!js.includes(s)) throw new Error('Missing JS feature: '+s);
          if(!sw.includes('wardogs-field-v6')||!sw.includes('./app.js')) throw new Error('Service worker is not on V6');
          console.log('V6 shell wiring passed');
          NODE
      - name: Check high-resolution map and firing-table endpoints
        run: |
          curl -fsSL --retry 3 -o /dev/null https://cdn.jsdelivr.net/gh/apollyon-sys/wardogs-calculator@main/maps/tiles/bakurani/zoom_7/0_0.webp
          curl -fsSL --retry 3 -o /dev/null https://cdn.jsdelivr.net/gh/apollyon-sys/wardogs-calculator@main/maps/tiles/ozeti/zoom_7/0_0.webp
          curl -fsSL --retry 3 -o /tmp/weapons.json https://raw.githubusercontent.com/apollyon-sys/wardogs-calculator/main/data/weapons.json
          node -e "const x=require('/tmp/weapons.json'); if(!x.weapons.some(w=>w.id==='mortar')||!x.weapons.some(w=>w.id==='spg')) process.exit(1); console.log('High-resolution map tiles and firing tables reachable')"
