name: Wardogs QA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'));console.log('manifest OK')"
      - name: Syntax check V18
        run: |
          node --check app.js
          node --check app-v11.js
          node --check worker.js
          node --check map-v18.js
          node --check map-v18-style.js
          node --check tests/live-smoke.cjs
      - name: Validate V18 wiring
        run: |
          node - <<'NODE'
          const fs=require('fs');const html=fs.readFileSync('index.html','utf8');const boot=fs.readFileSync('app.js','utf8');const map=fs.readFileSync('map-v18.js','utf8');const css=fs.readFileSync('map-v18-style.js','utf8');const sw=fs.readFileSync('service-worker.js','utf8');const worker=fs.readFileSync('worker.js','utf8');const wr=fs.readFileSync('wrangler.jsonc','utf8');
          for(const x of ['towerLayer','factionLayer','vendorLayer','spawnLayer','gridLayer','mapBrightness','fitMap'])if(!html.includes(x))throw Error('HTML '+x);
          for(const x of ['app-v11.js?v=18','map-v18-style.js?v=18','map-v18.js?v=18'])if(!boot.includes(x))throw Error('boot '+x);
          for(const x of ['data.bounds','data.tileBounds','tileZoom','ancestor','Number(m.y)/100','v18-tower-marker','v18-quick'])if(!map.includes(x))throw Error('map '+x);
          for(const x of ['v18-map-root','v18-map-canvas','v18-tower-marker','v18-map-tools'])if(!css.includes(x))throw Error('css '+x);
          if(!sw.includes('wardogs-field-v18')||!sw.includes('map-v18.js'))throw Error('sw');
          for(const x of ['TILE_ROOT','ALLOWED','env.ASSETS.fetch','image/webp'])if(!worker.includes(x))throw Error('worker '+x);
          for(const x of ['"main": "./worker.js"','"binding": "ASSETS"','"run_worker_first"'])if(!wr.includes(x))throw Error('wrangler '+x);
          console.log('V18 source wiring PASS');
          NODE
      - name: Validate source map data
        run: |
          curl -fsSL --retry 3 https://raw.githubusercontent.com/apollyon-sys/wardogs-calculator/main/maps/bakurani.json -o /tmp/bakurani.json
          curl -fsSL --retry 3 https://raw.githubusercontent.com/apollyon-sys/wardogs-calculator/main/maps/ozeti.json -o /tmp/ozeti.json
          curl -fsSL --retry 3 -o /dev/null https://assets.wardogs-artillery.com/releases/assets-v1/maps/tiles/bakurani/zoom_7/0_0.webp
          node - <<'NODE'
          const fs=require('fs');for(const id of ['bakurani','ozeti']){const x=JSON.parse(fs.readFileSync('/tmp/'+id+'.json'));if((x.tiles?.maxZoom??0)<7)throw Error(id+' maxZoom');if(!x.tileBounds||!x.bounds)throw Error(id+' bounds');if(!(x.markers||[]).some(m=>m.icon==='tower'))throw Error(id+' tower')}const b=JSON.parse(fs.readFileSync('/tmp/bakurani.json'));if(b.markers.filter(m=>m.icon==='tower').length!==5)throw Error('Bakurani tower count');if(b.coordinateMetersPerUnit!==100)throw Error('coordinate scale');console.log('Source map data PASS');
          NODE
      - name: Validate firing tables
        run: |
          curl -fsSL --retry 3 https://raw.githubusercontent.com/apollyon-sys/wardogs-calculator/main/data/weapons.json -o /tmp/weapons.json
          node -e "const x=require('/tmp/weapons.json');if(!x.weapons.some(w=>w.id==='mortar')||!x.weapons.some(w=>w.id==='spg'))process.exit(1);console.log('Firing tables PASS')"
      - name: Live worker shell smoke test
        run: |
          curl -fsSL --retry 3 https://wardogs-field-assistant2.cloudsoo2004.workers.dev/ -o /tmp/live.html
          grep -q 'app.js' /tmp/live.html
          grep -q 'WARDOGS FIELD ASSISTANT' /tmp/live.html
          echo 'Live worker shell PASS'
      - name: Browser E2E on deployed worker
        run: |
          npm install --no-save playwright-core >/dev/null 2>&1
          node tests/live-smoke.cjs
      - name: Upload browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wardogs-map-browser-proof
          path: test-artifacts/
          if-no-files-found: ignore
