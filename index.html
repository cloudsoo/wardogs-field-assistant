<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1117"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><title>WARDOGS Field Assistant</title><style>
:root{--bg:#0d1117;--p:#161b22;--l:#303846;--b:#3f8cff;--y:#ffd451;--g:#64d98b;--m:#9aa7b8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.app{max-width:780px;margin:auto;padding:14px 12px 20px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.brand{font-size:19px;font-weight:800}.sub{font-size:11px;color:var(--m);margin-top:4px}button,select{border:1px solid var(--l);background:#202936;color:#fff;border-radius:10px;padding:11px;font-weight:700;font-size:14px}.top{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:10px}.map{height:58vh;min-height:410px;border:1px solid var(--l);border-radius:16px;position:relative;overflow:hidden;background-color:#17202b;background-image:linear-gradient(#ffffff14 1px,transparent 1px),linear-gradient(90deg,#ffffff14 1px,transparent 1px);background-size:10% 10%;touch-action:none}.hint{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--m);pointer-events:none}.marker{position:absolute;transform:translate(-50%,-50%);font-size:30px;filter:drop-shadow(0 2px 3px #000)}.tools{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}.active{background:var(--b);border-color:var(--b)}.card{background:var(--p);border:1px solid var(--l);border-radius:15px;padding:12px;margin-top:9px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.item{background:#10151c;border-radius:10px;padding:11px}.label{font-size:11px;color:var(--m)}.value{font-size:21px;font-weight:800;margin-top:4px}.y{color:var(--y)}.b{color:#76b2ff}.g{color:var(--g)}.foot{text-align:center;color:#657186;font-size:10px;padding-top:13px}@media(max-width:390px){.tools{grid-template-columns:1fr 1fr}.tools #clear{grid-column:1/3}}
</style></head><body><div class="app"><div class="head"><div><div class="brand">🎯 WARDOGS FIELD ASSISTANT</div><div class="sub" id="sub">Tactical Map & Artillery Calculator</div></div><button id="lang">中文</button></div><div class="top"><select id="maps"><option>Bakurani</option><option>Ozeti</option><option>Zestafona</option></select><button onclick="location.reload()" id="reset">Reset</button></div><div id="map" class="map"><div id="hint" class="hint">MAP READY<br><small>SET GUN → tap map → SET TARGET → tap map</small></div></div><div class="tools"><button id="gun" class="active">📍 SET GUN</button><button id="target">🎯 SET TARGET</button><button id="clear">CLEAR</button></div><div class="card"><div class="grid"><div class="item"><div class="label" id="dl">DISTANCE</div><div class="value y" id="dist">-- m</div></div><div class="item"><div class="label" id="bl">BEARING</div><div class="value b" id="bear">--°</div></div><div class="item"><div class="label" id="dirl">DIRECTION</div><div class="value" id="dir">--</div></div><div class="item"><div class="label" id="sl">STATUS</div><div class="value g" id="status">READY</div></div></div></div><div class="card"><div class="label">MAP SCALE / 地图比例</div><div style="font-size:12px;color:#9aa7b8;margin-top:6px">16 × 16 km reference grid • future licensed map layers supported</div></div><div class="foot">WARDOGS Field Assistant • V1 PWA</div></div><script>
const $=x=>document.getElementById(x);let mode='gun',gun=null,target=null,zh=false;
const text={en:['Tactical Map & Artillery Calculator','📍 SET GUN','🎯 SET TARGET','CLEAR','Reset','DISTANCE','BEARING','DIRECTION','STATUS','READY','CALCULATED','MAP READY<br><small>SET GUN → tap map → SET TARGET → tap map</small>'],zh:['战术地图与炮击计算器','📍 设置炮位','🎯 设置目标','清除','重置','距离','方位角','方向','状态','准备完成','已计算','地图已准备<br><small>先设置炮位点击地图，再设置目标点击地图</small>']};
function render(){document.querySelectorAll('.marker').forEach(e=>e.remove());[[gun,'📍'],[target,'🎯']].forEach(([p,i])=>{if(!p)return;let e=document.createElement('div');e.className='marker';e.style.left=p.x+'%';e.style.top=p.y+'%';e.textContent=i;$('map').appendChild(e)})}
function calc(){if(!gun||!target)return;let dx=target.x-gun.x,dy=target.y-gun.y,d=Math.hypot(dx,dy)*160,b=Math.atan2(dx,-dy)*180/Math.PI;if(b<0)b+=360;let a=['N ↑','NE ↗','E →','SE ↘','S ↓','SW ↙','W ←','NW ↖'];$('dist').textContent=Math.round(d)+' m';$('bear').textContent=b.toFixed(1)+'°';$('dir').textContent=a[Math.floor((b+22.5)/45)%8];$('status').textContent=(zh?text.zh:text.en)[10]}
function set(m){mode=m;$('gun').classList.toggle('active',m==='gun');$('target').classList.toggle('active',m==='target')} $('gun').onclick=()=>set('gun');$('target').onclick=()=>set('target');
$('map').onclick=e=>{let r=e.currentTarget.getBoundingClientRect(),p={x:(e.clientX-r.left)/r.width*100,y:(e.clientY-r.top)/r.height*100};if(mode==='gun')gun=p;else target=p;render();calc();$('hint').style.display='none'};
$('clear').onclick=()=>{gun=target=null;render();$('dist').textContent='-- m';$('bear').textContent='--°';$('dir').textContent='--';$('status').textContent=(zh?text.zh:text.en)[9];$('hint').style.display='grid'};
$('lang').onclick=()=>{zh=!zh;let t=zh?text.zh:text.en;$('lang').textContent=zh?'English':'中文';$('sub').textContent=t[0];$('gun').textContent=t[1];$('target').textContent=t[2];$('clear').textContent=t[3];$('reset').textContent=t[4];$('dl').textContent=t[5];$('bl').textContent=t[6];$('dirl').textContent=t[7];$('sl').textContent=t[8];$('hint').innerHTML=t[11]};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js');
</script></body></html>
