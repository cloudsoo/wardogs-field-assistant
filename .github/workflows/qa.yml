name: Wardogs QA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'));console.log('manifest OK')"
      - name: Syntax check V23
        run: |
          node --check app.js
          node --check app-v19.js
          node --check worker.js
          node --check map-v22.js
          node --check map-v22-fix.js
          node --check tests/live-smoke.cjs
      - name: Validate V23 wiring
        run: |
          node - <<'NODE'
          const fs=require('fs');const html=fs.readFileSync('index.html','utf8');const boot=fs.readFileSync('app.js','utf8');const core=fs.readFileSync('app-v19.js','utf8');const map=fs.readFileSync('map-v22.js','utf8');const fix=fs.readFileSync('map-v22-fix.js','utf8');const sw=fs.readFileSync('service-worker.js','utf8');const worker=fs.readFileSync('worker.js','utf8');const wr=fs.readFileSync('wrangler.jsonc','utf8');
          for(const x of ['towerLayer','inactiveTowerLayer','factionLayer','vendorLayer','spawnLayer','gridLayer','mapBrightness','fitMap'])if(!html.includes(x))throw Error('HTML '+x);
          for(const x of ['app-v19.js?v=23','map-v22.js?v=23','map-v22-fix.js?v=23'])if(!boot.includes(x))throw Error('boot '+x);
          for(const x of ['state.lang','wardogs:i18n','setMode','window.Wardogs19'])if(!core.includes(x))throw Error('core '+x);
          for(const x of ['index.json','tileBounds','inactive_tower','v22-tower','v22-quick','v22-x','v22-y','setGun','Math.max(.72'])if(!map.includes(x))throw Error('map '+x);
          for(const x of ['fitMap','q.zoom=0','q.px=0','q.py=0','m.refresh'])if(!fix.includes(x))throw Error('fit fix '+x);
          if(!sw.includes('wardogs-field-v23')||!sw.includes('./map-v22-fix.js'))throw Error('service worker');
          for(const x of ['TILE_ROOT','SAFE_MAP','env.ASSETS.fetch','image/webp'])if(!worker.includes(x))throw Error('worker '+x);
          for(const x of ['"main": "./worker.js"','"binding": "ASSETS"','"run_worker_first"'])if(!wr.includes(x))throw Error('wrangler '+x);
          console.log('V23 source wiring PASS');
          NODE
      - name: Validate current map registry and exact source data
        run: |
          curl -fsSL --retry 3 https://raw.githubusercontent.com/apollyon-sys/wardogs-calculator/main/maps/index.json -o /tmp/maps-index.json
          node - <<'NODE'
          const fs=require('fs');const a=JSON.parse(fs.readFileSync('/tmp/maps-index.json'));if(!Array.isArray(a)||a.length<3)throw Error('map registry incomplete');console.log('Registry:',a.join(', '));
          NODE
          for id in bakurani ozeti zestafona; do curl -fsSL --retry 3 https://raw.githubusercontent.com/apollyon-sys/wardogs-calculator/main/maps/$id.json -o /tmp/$id.json; done
          node - <<'NODE'
          const fs=require('fs');for(const id of ['bakurani','ozeti','zestafona']){const x=JSON.parse(fs.readFileSync('/tmp/'+id+'.json'));if(!x.bounds||!x.tileBounds||x.tiles?.maxZoom<7)throw Error(id+' bounds/zoom');if(x.coordinateMetersPerUnit!==100)throw Error(id+' scale');if(!Array.isArray(x.markers))throw Error(id+' markers');console.log(id,'towers',x.markers.filter(m=>m.icon==='tower').length)}const b=JSON.parse(fs.readFileSync('/tmp/bakurani.json'));const want=[['Tower 1',80.52,69.85],['Tower 2',77.19,70],['Tower 3',77.19,73.44],['Tower 4',83.64,72.85],['Tower 5',82.22,68.41]].sort();const got=b.markers.filter(m=>m.icon==='tower').map(m=>[m.label,Number(m.x)/100,Number(m.y)/100]).sort();if(JSON.stringify(got)!==JSON.stringify(want))throw Error('Bakurani coordinates mismatch');const o=JSON.parse(fs.readFileSync('/tmp/ozeti.json'));if(o.markers.filter(m=>m.icon==='tower').length!==4)throw Error('Ozeti tower count');const v=o.markers.find(m=>m.icon==='valkyra');if(!v||Number(v.x)/100!==118.75||Number(v.y)/100!==70.93)throw Error('Ozeti Valkyra coordinate mismatch');console.log('Exact source map data PASS');
          NODE
      - name: Validate HD tile origin and future-map proxy
        run: |
          curl -fsSL --retry 3 -o /dev/null https://assets.wardogs-artillery.com/releases/assets-v1/maps/tiles/bakurani/zoom_7/0_0.webp
          for id in bakurani ozeti zestafona; do curl -fsSL --retry 3 -o /dev/null -w '%{http_code}\n' https://wardogs-field-assistant2.cloudsoo2004.workers.dev/tiles/$id/zoom_7/0_0.webp | grep -qx 200; done
          echo 'HD tile origin and future-map proxy PASS'
      - name: Validate firing tables
        run: |
          curl -fsSL --retry 3 https://raw.githubusercontent.com/apollyon-sys/wardogs-calculator/main/data/weapons.json -o /tmp/weapons.json
          node -e "const x=require('/tmp/weapons.json');if(!x.weapons.some(w=>w.id==='mortar')||!x.weapons.some(w=>w.id==='spg'))process.exit(1);console.log('Firing tables PASS')"
      - name: Wait for live V23 deployment
        run: |
          for i in $(seq 1 36); do
            app=$(curl -fsSL --retry 2 'https://wardogs-field-assistant2.cloudsoo2004.workers.dev/app.js?v=23' || true)
            map=$(curl -fsSL --retry 2 'https://wardogs-field-assistant2.cloudsoo2004.workers.dev/map-v22.js?v=23' || true)
            fix=$(curl -fsSL --retry 2 'https://wardogs-field-assistant2.cloudsoo2004.workers.dev/map-v22-fix.js?v=23' || true)
            if echo "$app" | grep -q 'map-v22.js?v=23' && echo "$fix" | grep -q 'fitMap'; then echo 'Live V23 deployment PASS'; exit 0; fi
            echo "Waiting for Cloudflare deployment... attempt $i/36"; sleep 5
          done
          echo 'Live V23 deployment did not become active in time'; exit 1
      - name: Live worker shell smoke test
        run: |
          curl -fsSL --retry 3 https://wardogs-field-assistant2.cloudsoo2004.workers.dev/ -o /tmp/live.html
          grep -q 'app.js' /tmp/live.html
          grep -q 'WARDOGS FIELD ASSISTANT' /tmp/live.html
          echo 'Live worker shell PASS'
      - name: Browser E2E on deployed worker
        run: |
          npm install --no-save playwright-core >/dev/null 2>&1
          node tests/live-smoke.cjs
      - name: Upload browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wardogs-map-browser-proof
          path: test-artifacts/
          if-no-files-found: ignore
