<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#081018"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="WARDOGS"><link rel="manifest" href="manifest.json"><title>WARDOGS Field Assistant</title><style>:root{--bg:#081018;--panel:#111a23;--panel2:#0b1219;--line:#2a3b4b;--line2:#3d5366;--blue:#3f93ff;--blue2:#7fbaff;--yellow:#ffd45b;--green:#61dc8b;--red:#ff727b;--orange:#ff9d45;--muted:#93a3b5}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -15%,#1b3040,#081018 52%);color:#eef4f9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button,input,select{font:inherit}button,select{border:1px solid var(--line2);background:linear-gradient(#1c2834,#121a23);color:#fff;border-radius:10px;padding:10px 11px;font-size:13px;font-weight:850;box-shadow:inset 0 1px #ffffff08}button:active{transform:scale(.985)}button.active{background:linear-gradient(#4a9cff,#2b70d2);border-color:#6ab0ff}.danger{border-color:#6b3740;color:#ffabb0}.app{max-width:860px;margin:auto;padding:8px 11px 92px}.head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 1px 11px}.eyebrow{font:9px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.6px;color:var(--blue2)}.brand{font-size:18px;font-weight:950;letter-spacing:.6px;margin-top:2px}.sub{font-size:10px;color:var(--muted);margin-top:3px}.page{display:none}.page.active{display:block}.card{background:linear-gradient(180deg,#131e28,#0f161e);border:1px solid var(--line);border-radius:15px;padding:12px;margin-top:9px;box-shadow:0 10px 28px #0006}.titl nt:900 14px ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:4px}.layergrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:9px}.check{display:flex;align-items:center;gap:7px;background:#0a1118;border:1px solid #22313f;border-radius:9px;padding:9px;font-size:12px;min-width:0}.check input{width:16px;height:16px;accent-color:var(--blue)}.brightness{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin-top:9px;background:#0a1118;border:1px solid #22313f;border-radius:9px;padding:9px}.brightness input{width:100%}.note,.tiny{font-size:10px;line-height:1.5;color:#728297;text-align:center;margin-top:10px}.note a{color:#7cb8ff}.bottom{position:fixed;z-index:80;left:0;right:0;bottom:0;background:#060b10ee;border-top:1px solid var(--line);backdrop-filter:blur(13px);padding:8px max(9px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(9px,env(safe-area-inset-left))}.nav{max-width:860px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);z-index:100;background:#04090eee;border:1px solid #4b6275;border-radius:10px;padding:9px 12px;font-size:11px;opacity:0;pointer-events:none;transition:.18s}.toast.show{opacity:1}@media(max-width:620px){.layergrid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:390px){.brand{font-size:16px}.value{font-size:19px}.field input{font-size:18px}.maptop{grid-template-columns:1fr auto auto auto}.maptop #reload{display:none}}</style></head><body><div class="app"><div class="head"><div><div class="eyebrow">WARDOGS // FIELD SYSTEM</div><div class="brand">🎯 WARDOGS FIELD ASSISTANT</div><div class="sub" id="sub"></div></div><button id="lang">EN</button></div><section id="page1" class="page active"><div class="card"><div class="title"><b id="title1"></b><span class="badge">FAST INPUT</span></div><div class="grid2" style="margin-top:10px"><div class="field"><label id="sxL"></label d">↻</button><button id="fitMap">⌂</button><button id="zoomOut">−</button><button id="zoomIn">+</button></div><div id="map" class="map"><div class="hud"><span id="mapHud">MAP // LIVE</span><span id="hudZoom">ZOOM 1×</span></div></div><div class="mapbtns"><button id="setGun" class="active"></button><button id="setTarget"></button><button id="lockGun"></button><button id="lockTarget"></button><button id="clearGun" class="danger"></button><button id="clearTarget" class="danger"></button><button id="resetMap" style="grid-column:1/3"></button></div><details class="card" open><summary id="layersTitle"></summary><div class="layergrid"><label class="check"><input id="towerLayer" type="checkbox" checked><span id="towerText"></span></label><label class="check"><input id="inactiveTowerLayer" type="checkbox"><span id="inactiveTowerText"></span></label><label class="check"><input id="factionLayer" type="checkbox"><span id="factionText"></span></label><label class="check"><input id="vendorLayer" type="checkbox"><span id="vendorText"></span></label><label class="check"><input id="spawnLayer" type="checkbox"><span id="spawnText"></span></label><label class="check"><input id="gridLayer" type="checkbox" checked><span id="gridText"></span></label></div><div class="brightness"><span id="brightnessText">地图亮度</span><input id="mapBrightness" type="range" min="65" max="135" step="1" value="100"><span id="brightnessValue">100%</span></div></details><div class="coords"><div id="gunBox" class="coordbox"><div class="label" id="gunLabel"></div><div class="coord" id="gunCoord">--</div></div><div id="targetBox" class="coordbox"><div class="label" id="targetLabel"></div><div class="coord" id="targetCoord">--</div></div></div><div class="card tiny" id="mapHelp"></div><div class="note" id="mapDataNote"></div></section></div><div class="bottom"><div class="nav"><button id="nav1" class="active"></button><button id="nav2"></button></div></div><div id="toast" class="toast"></div><script src="app.js" def
