<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#070b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WARDOGS">
<link rel="manifest" href="manifest.json">
<title>WARDOGS Field Assistant</title>
<style>
:root{--bg:#070b10;--p:#111923;--p2:#0a1017;--l:#293847;--l2:#42576b;--b:#3b92ff;--b2:#7dbaff;--y:#ffd654;--g:#61dc8b;--o:#ff9f45;--r:#ff7078;--m:#8fa0b2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -20%,#1a3042,#070b10 52%);color:#eef4f9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button,input,select{font:inherit}button,select{border:1px solid var(--l2);background:linear-gradient(#1d2935,#121a22);color:#fff;border-radius:10px;padding:10px 11px;font-size:13px;font-weight:850}button:active{transform:scale(.985)}button.active{background:linear-gradient(#499dff,#2b71d4);border-color:#66afff}.danger{border-color:#65353b;color:#ff9ca2}.app{max-width:860px;margin:auto;padding:8px 11px 94px}.head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 1px 12px}.eyebrow{font:9px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--b2);letter-spacing:1.6px}.brand{font-size:18px;font-weight:950;letter-spacing:.5px}.sub{font-size:10px;color:var(--m);margin-top:3px}.page{display:none}.page.active{display:block}.card{background:linear-gradient(180deg,#131d27,#0f151d);border:1px solid var(--l);border-radius:15px;padding:12px;margin-top:9px;box-shadow:0 10px 28px #0006}.title{display:flex;justify-content:space-between;align-items:center;gap:8px}.badge{font:9px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--m);border:1px solid var(--l2);padding:4px 6px;border-radius:99px}.grid2,.results,.coords{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field label,.label{display:block;color:var(--m);font:10px ui-monospace,SFMono-Regular,Menlo,monospace;margin-bottom:5px}.field input,.code{width:100%;background:#060a0e;border:1px solid var(--l);color:#fff;border-radius:9px;padding:12px;text-align:center;font-size:19px;font-weight:900;outline:none}.field input:focus,.code:focus{border-color:var(--b);box-shadow:0 0 0 2px #3b92ff22}.actions,.weapon,.maptop,.mapbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.results{margin-top:9px}.result{background:var(--p2);border:1px solid #20303e;border-radius:10px;padding:10px}.value{font-size:21px;font-weight:950;margin-top:4px}.y{color:var(--y)}.blue{color:var(--b2)}.green{color:var(--g)}.orange{color:var(--o)}.red{color:var(--r)}.codeout{font:900 18px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--y);text-align:center;margin-top:8px}.maptop{grid-template-columns:1fr auto auto auto;margin-top:0}.map{height:62vh;min-height:420px;position:relative;overflow:hidden;border:1px solid var(--l2);border-radius:16px;background:#101a23;touch-action:none;box-shadow:0 16px 38px #0008}.world{position:absolute;inset:0;transform-origin:0 0;will-change:transform}.tiles{position:absolute;inset:0;background:#14212b}.tile{position:absolute;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}.gridline{position:absolute;inset:0;background-image:linear-gradient(#67b2ed1d 1px,transparent 1px),linear-gradient(90deg,#67b2ed1d 1px,transparent 1px);background-size:6.25% 6.25%;pointer-events:none}.hud{position:absolute;z-index:30;left:8px;right:8px;top:8px;display:flex;justify-content:space-between;pointer-events:none}.hud span{background:#050a0fdc;border:1px solid var(--l2);border-radius:7px;padding:5px 7px;font:9px ui-monospace,SFMono-Regular,Menlo,monospace}.poi{position:absolute;z-index:20;transform:translate(-50%,-50%);text-align:center;cursor:pointer}.poi i{font-style:normal;width:22px;height:22px;display:block;margin:auto;color:#dbe8f5;filter:drop-shadow(0 2px 2px #000)}.poi i svg{display:block;width:22px;height:22px}.poi b{display:block;background:#05090de8;border:1px solid #314251;color:#e9f1f8;border-radius:4px;padding:2px 4px;margin-top:2px;font:8px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap}.point{position:absolute;z-index:25;transform:translate(-50%,-50%);font-size:28px;pointer-events:none;filter:drop-shadow(0 2px 3px #000)}.point.locked{filter:drop-shadow(0 2px 3px #000) drop-shadow(0 0 8px #61dc8b77)}.layergrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.check{display:flex;align-items:center;gap:8px;background:#0b1219;border:1px solid #22313f;border-radius:9px;padding:9px;font-size:12px}.check input{width:16px;height:16px;accent-color:var(--b)}.coords{margin-top:8px}.coordbox{background:#0a1118;border:1px solid #243340;border-radius:9px;padding:10px}.coord{font:900 14px ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:4px}.lockedbox{border-color:#3d7956;box-shadow:inset 0 0 0 1px #61dc8b22}.note,.tiny{font-size:10px;line-height:1.5;color:#748296;text-align:center;margin-top:10px}.note a{color:#7fb9ff}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#070b10ed;border-top:1px solid var(--l);backdrop-filter:blur(13px);padding:8px max(9px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(9px,env(safe-area-inset-left))}.nav{max-width:860px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);z-index:90;background:#04080cef;border:1px solid #405367;border-radius:10px;padding:9px 12px;font-size:11px;opacity:0;pointer-events:none;transition:.18s}.toast.show{opacity:1}@media(max-width:390px){.brand{font-size:16px}.maptop{grid-template-columns:1fr auto auto}.value{font-size:19px}.field input{font-size:18px}.layergrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<div class="head"><div><div class="eyebrow">WARDOGS // FIELD SYSTEM</div><div class="brand">🎯 WARDOGS FIELD ASSISTANT</div><div class="sub" id="sub"></div></div><button id="lang"></button></div>
<section id="page1" class="page active">
<div class="card"><div class="title"><b id="title1"></b><span class="badge">FAST INPUT</span></div><div class="grid2" style="margin-top:10px"><div class="field"><label id="sxL"></label><input id="sx" inputmode="decimal" type="number" step="0.01"></div><div class="field"><label id="syL"></label><input id="sy" inputmode="decimal" type="number" step="0.01"></div><div class="field"><label id="txL"></label><input id="tx" inputmode="decimal" type="number" step="0.01"></div><div class="field"><label id="tyL"></label><input id="ty" inputmode="decimal" type="number" step="0.01"></div></div><div class="actions"><button id="calc" class="active"></button><button id="clear"></button></div></div>
<div class="card"><div class="title"><b id="bearingTitle"></b><span class="badge">0–359.9°</span></div><div class="actions" style="grid-template-columns:1fr auto"><input id="bearingInput" class="code" inputmode="decimal" type="number" min="0" max="359.9" step="0.1" placeholder="000.0"><button id="bearingBtn" class="active"></button></div><div id="bearingOut" class="codeout">--</div></div>
<div class="weapon"><select id="weapon"><option value="mortar"></option><option value="spg"></option></select><button id="ballisticsBtn"></button></div>
<div class="results"><div class="result"><div class="label" id="distL"></div><div class="value y" id="distance">--</div></div><div class="result"><div class="label" id="azL"></div><div class="value blue" id="bearing">--</div></div><div class="result"><div class="label" id="dirL"></div><div class="value" id="direction">--</div></div><div class="result"><div class="label" id="rangeL"></div><div class="value green" id="range">--</div></div><div class="result"><div class="label" id="milL"></div><div class="value y" id="mil">--</div></div><div class="result"><div class="label" id="arcL"></div><div class="value orange" id="arc">--</div></div></div>
<div class="card tiny" id="p1note"></div>
</section>
<section id="page2" class="page">
<div class="maptop"><select id="mapSelect"><option value="bakurani">BAKURANI</option><option value="ozeti">OZETI</option></select><button id="reload">↻</button><button id="zoomOut">−</button><button id="zoomIn">+</button></div>
<div id="map" class="map"><div id="world" class="world"><div id="tiles" class="tiles"></div><div id="grid" class="gridline"></div><svg id="zones" viewBox="0 0 16384 16384" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"></svg></div><div class="hud"><span id="mapHud">MAP // LIVE</span><span id="hudZoom">ZOOM 1×</span></div></div>
<div class="mapbtns"><button id="setGun" class="active"></button><button id="setTarget"></button><button id="lockGun"></button><button id="lockTarget"></button><button id="clearGun" class="danger"></button><button id="clearTarget" class="danger"></button><button id="resetMap" style="grid-column:1/3"></button></div>
<details class="card" open><summary id="layersTitle"></summary><div class="layergrid"><label class="check"><input id="towerLayer" data-layer="tower" type="checkbox" checked><span id="towerText"></span></label><label class="check"><input id="facilityLayer" data-layer="facility" type="checkbox"><span id="facilityText"></span></label><label class="check"><input id="battleLayer" data-layer="battle" type="checkbox" checked><span id="battleText"></span></label><label class="check"><input id="gridLayer" data-layer="grid" type="checkbox" checked><span id="gridText"></span></label></div></details>
<div class="coords"><div class="coordbox" id="gunBox"><div class="label" id="gunLabel"></div><div class="coord" id="gunCoord">--</div></div><div class="coordbox" id="targetBox"><div class="label" id="targetLabel"></div><div class="coord" id="targetCoord">--</div></div></div>
<div class="card tiny" id="mapHelp"></div><div class="note">Map source: <a href="https://github.com/apollyon-sys/wardogs-calculator" target="_blank" rel="noopener">apollyon-sys/wardogs-calculator</a> (MIT source project).</div>
</section></div>
<div class="bottom"><div class="nav"><button id="nav1" class="active"></button><button id="nav2"></button></div></div><div id="toast" class="toast"></div>
<script src="app.js" defer></script>
</body></html>
