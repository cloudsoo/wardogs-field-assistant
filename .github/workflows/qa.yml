name: Wardogs QA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest OK')"
      - name: Syntax check V16
        run: |
          node --check app.js
          node --check app-v11.js
          node --check worker.js
          node --check map-v14-style.js
          node --check map-v14-fix.js
          node --check tests/live-smoke.cjs
      - name: Validate V16 wiring
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const boot=fs.readFileSync('app.js','utf8');
          const v14=fs.readFileSync('map-v14-fix.js','utf8');
          const css=fs.readFileSync('map-v14-style.js','utf8');
          const sw=fs.readFileSync('service-worker.js','utf8');
          const worker=fs.readFileSync('worker.js','utf8');
          const wrangler=fs.readFileSync('wrangler.jsonc','utf8');
          for(const s of ['page1','page2','bearingInput','setGun','setTarget','lockGun','lockTarget','towerLayer','factionLayer','vendorLayer','spawnLayer','gridLayer','fitMap']) if(!html.includes(s)) throw new Error('Missing HTML: '+s);
          for(const s of ['app-v11.js?v=16','map-v14-style.js?v=16','map-v14-fix.js?v=16','第 1 页 · 坐标输入 / 火控']) if(!boot.includes(s)) throw new Error('Boot missing: '+s);
          for(const s of ['INITIAL_TILE_ZOOM=4','tileZoom','ancestor','tileUrl','tileBounds','v14-tower-marker','mapHoverCoord','factionLayer','vendorLayer','spawnLayer','doubleclick','pointers']) if(!v14.includes(s)) throw new Error('Missing V16 feature: '+s);
          for(const s of ['v14-map-root','v14-map-canvas','v14-tower-marker','v14-coord-readout','v14-map-tools','v14-fullscreen']) if(!css.includes(s)) throw new Error('Missing V16 style: '+s);
          if(!sw.includes('wardogs-field-v16')||!sw.includes('./map-v14-style.js')||!sw.includes('./map-v14-fix.js')) throw new Error('V16 service worker wiring failed');
          for(const s of ['/^zoom_(\\d+)$/','TILE_ROOT','ALLOWED','env.ASSETS.fetch','image/webp']) if(!worker.includes(s)) throw new Error('Worker proxy missing: '+s);
          for(const s of ['"main": "./worker.js"','"binding": "ASSETS"','"run_worker_first"']) if(!wrangler.includes(s)) throw new Error('Wrangler Worker config missing: '+s);
          console.log('V16 source wiring PASS');
          NODE
      - name: Validate map configs and source tiles
        run: |
          curl -fsSL --retry 3 https://raw.githubusercontent.com/apollyon-sys/wardogs-calculator/main/maps/bakurani.json -o /tmp/bakurani.json
          curl -fsSL --retry 3 https://raw.githubusercontent.com/apollyon-sys/wardogs-calculator/main/maps/ozeti.json -o /tmp/ozeti.json
          curl -fsSL --retry 3 -o /dev/null https://assets.wardogs-artillery.com/releases/assets-v1/maps/tiles/bakurani/zoom_7/0_0.webp
          node - <<'NODE'
          const fs=require('fs');
          for(const id of ['bakurani','ozeti']){const x=JSON.parse(fs.readFileSync('/tmp/'+id+'.json'));if((x.tiles?.maxZoom??0)<7)throw new Error(id+' maxZoom < 7');if(!(x.markers||[]).some(m=>m.icon==='tower'))throw new Error(id+' has no tower markers');if(!x.tiles?.path)throw new Error(id+' has no source tile path');console.log(id,'maxZoom',x.tiles.maxZoom,'tilePath',x.tiles.path)}
          const b=JSON.parse(fs.readFileSync('/tmp/bakurani.json'));const towers=b.markers.filter(m=>m.icon==='tower');if(towers.length!==5)throw new Error('Bakurani tower count '+towers.length+' != 5');for(const t of towers)if(!Number.isFinite(t.x)||!Number.isFinite(t.y))throw new Error('invalid tower coord '+t.label);console.log('Bakurani tower coordinate data PASS');
          NODE
      - name: Validate firing tables
        run: |
          curl -fsSL --retry 3 https://raw.githubusercontent.com/apollyon-sys/wardogs-calculator/main/data/weapons.json -o /tmp/weapons.json
          node -e "const x=require('/tmp/weapons.json');if(!x.weapons.some(w=>w.id==='mortar')||!x.weapons.some(w=>w.id==='spg'))process.exit(1);console.log('Firing tables PASS')"
      - name: Live worker shell smoke test
        run: |
          curl -fsSL --retry 3 https://wardogs-field-assistant2.cloudsoo2004.workers.dev/ -o /tmp/live.html
          grep -q 'app.js' /tmp/live.html
          grep -q 'WARDOGS FIELD ASSISTANT' /tmp/live.html
          echo 'Live worker shell PASS'
      - name: Browser E2E on deployed worker
        run: |
          npm install --no-save playwright-core >/dev/null 2>&1
          node tests/live-smoke.cjs
      - name: Upload browser recording and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wardogs-map-browser-proof
          path: test-artifacts/
          if-no-files-found: ignore
